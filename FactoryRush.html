<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Factory Rush Digital</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; }
        .game-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 800px; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .slot-container { border: 2px dashed #ccc; padding: 10px; border-radius: 8px; min-height: 200px; }
        .card { background: #e3f2fd; border: 1px solid #2196f3; padding: 10px; margin: 5px; border-radius: 4px; text-align: center; font-weight: bold; }
        .controls { margin-top: 20px; text-align: center; background: #fafafa; padding: 15px; border-radius: 8px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #4caf50; color: white; border: none; border-radius: 5px; margin: 5px; }
        button:disabled { background: #ccc; }
        .market { color: #d32f2f; font-size: 0.9em; }
        .status-win { color: green; font-weight: bold; }
        .status-lose { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h1>🏭 FACTORY RUSH DIGITAL</h1>

<div class="game-container">
    <div class="header">
        <div>MODAL: <b id="display-modal">0</b> JT</div>
        <div>BULAN: <b id="display-bulan">1</b> / 12</div>
    </div>

    <div class="grid">
        <div class="slot-container">
            <h3>ASSET (Pabrik)</h3>
            <div id="asset-list"></div>
        </div>
        <div class="slot-container">
            <h3>SHOP / MARKET</h3>
            <div id="shop-area"></div>
        </div>
    </div>

    <div id="message" style="margin-top: 15px; text-align: center;"></div>

    <div class="controls">
        <button id="btn-modal" onclick="initModal()">1. Roll Modal Awal</button>
        <button id="btn-draw" onclick="drawCard()" disabled>2. Ambil Kartu (Dadu)</button>
        <div id="action-buttons" style="display:none;">
            <button onclick="buyCard()" style="background:#2196f3;">Beli Komponen</button>
            <button onclick="toMarket()" style="background:#ff9800;">Buang ke Market</button>
        </div>
    </div>
</div>

<script>
    let modal = 0;
    let bulan = 1;
    let assets = new Set();
    let marketCards = [];
    let currentCard = null;
    let prices = { 1: 50, 2: 70, 3: 100, 4: 120, 5: 150, 6: 200 }; // Contoh harga komponen

    function initModal() {
        let r1 = Math.floor(Math.random() * 6) + 1;
        let r2 = Math.floor(Math.random() * 6) + 1;
        let r3 = Math.floor(Math.random() * 6) + 1;
        modal = (r1 * 100) + (r2 * 10) + r3;
        
        document.getElementById('display-modal').innerText = modal;
        document.getElementById('btn-modal').disabled = true;
        document.getElementById('btn-draw').disabled = false;
        log("Modal ditentukan: " + modal + " JT. Silakan lempar dadu untuk ambil kartu.");
    }

    function drawCard() {
        if (bulan > 15) return checkWinCondition();
        
        let die = Math.floor(Math.random() * 6) + 1;
        currentCard = { id: die, price: prices[die], isMarket: false };
        
        // Cek jika kartu ini sudah ada di market
        let inMarket = marketCards.find(c => c.id === die);
        if (inMarket) {
            currentCard.price = Math.floor(inMarket.price * 1.5);
            currentCard.isMarket = true;
        }

        document.getElementById('shop-area').innerHTML = `
            <div class="card">
                KOMPONEN #${currentCard.id}<br>
                Harga: ${currentCard.price} JT
                ${currentCard.isMarket ? '<br><span class="market">(Harga Market 150%)</span>' : ''}
            </div>`;
        
        document.getElementById('btn-draw').disabled = true;
        document.getElementById('action-buttons').style.display = 'block';
    }

    function buyCard() {
        if (modal >= currentCard.price) {
            modal -= currentCard.price;
            assets.add(currentCard.id);
            updateDisplay();
            nextTurn();
        } else {
            alert("Modal tidak cukup!");
        }
    }

    function toMarket() {
        if (!marketCards.find(c => c.id === currentCard.id)) {
            marketCards.push({id: currentCard.id, price: prices[currentCard.id]});
        }
        nextTurn();
    }

    function nextTurn() {
        bulan++;
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('shop-area').innerHTML = "";
        updateDisplay();
        
        if (bulan > 12 && assets.size < 6 && modal > 0) {
            log("Masuk masa bonus bulan " + bulan);
        }

        if (bulan > 15 || (modal <= 0 && assets.size < 6)) {
            checkWinCondition();
        } else {
            document.getElementById('btn-draw').disabled = false;
        }
    }

    function updateDisplay() {
        document.getElementById('display-modal').innerText = modal;
        document.getElementById('display-bulan').innerText = bulan;
        
        let assetHTML = "";
        for (let a of assets) {
            assetHTML += `<div class="card" style="background:#c8e6c9; border-color:#4caf50;">ASET #${a} ✅</div>`;
        }
        document.getElementById('asset-list').innerHTML = assetHTML;
    }

    function log(msg) {
        document.getElementById('message').innerText = msg;
    }

    function checkWinCondition() {
        document.getElementById('btn-draw').disabled = true;
        let msg = "";
        if (assets.size === 6) {
            if (modal > 0) msg = "<span class='status-win'>MENANG! Pabrik Beroperasi & Laba!</span>";
            else msg = "<span class='status-win'>MENANG! Pabrik Terbentuk namun Mandek (Modal Pas).</span>";
        } else {
            msg = "<span class='status-lose'>KALAH! Pembangunan Mangkrak.</span>";
        }
        document.getElementById('message').innerHTML = `<h2>HASIL AKHIR:</h2> ${msg}`;
    }
</script>

</body>
</html>
