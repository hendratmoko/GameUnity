<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Rush: Industrial Tycoon</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --success: #2ecc71;
            --gold: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow-x: hidden;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 95%;
            max-width: 1000px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 0px var(--gold)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 15px var(--gold)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0px var(--gold)); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }

        .level-badge {
            background: var(--gold);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            min-height: 350px;
        }

        /* Icon Styling */
        .icon {
            font-size: 24px;
            margin-right: 10px;
            display: inline-block;
        }

        .active-icon {
            animation: pulse 2s infinite ease-in-out;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            transition: 0.3s;
            border-left: 4px solid transparent;
            animation: slideIn 0.4s ease-out;
        }

        .card.owned {
            border-left-color: var(--success);
            background: rgba(46, 204, 113, 0.2);
        }

        .card.pending {
            border-left-color: var(--accent);
            opacity: 0.6;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-main { background: var(--success); color: white; }
        .btn-main:hover { background: #27ae60; transform: translateY(-2px); }
        .btn-alt { background: var(--gold); color: black; }

        .modal-display {
            font-size: 2em;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="finish-overlay" class="overlay">
    <h1 id="finish-title" style="font-size: 4em;"></h1>
    <p id="finish-sub" style="font-size: 1.5em;"></p>
    <div id="finish-icon" style="font-size: 100px; margin: 20px;"></div>
    <button class="btn btn-alt" onclick="resetGame()">Main Lagi / Level Berikutnya</button>
</div>

<div class="game-container">
    <div class="header">
        <div>
            <span id="level-text" class="level-badge">Level 1: Startup</span>
            <div style="margin-top: 5px;">Bulan: <span id="display-bulan">1</span> / 12</div>
        </div>
        <div style="text-align: right;">
            <div>Sisa Modal:</div>
            <div class="modal-display"><span id="display-modal">0</span> <small>M</small></div>
        </div>
    </div>

    <div class="main-layout">
        <div class="section">
            <h3>🛒 Procurement (Shop)</h3>
            <div id="draw-area">
                <p style="color: #888;">Silakan klik "Roll Dadu" untuk mencari komponen.</p>
            </div>
            <div id="market-area" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
                </div>
        </div>

        <div class="section">
            <h3>🏗️ Factory Blueprint</h3>
            <div id="asset-list"></div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <button id="btn-init" class="btn btn-alt" onclick="initModal()">Roll Modal Awal</button>
        <button id="btn-draw" class="btn btn-main" onclick="drawCard()" disabled>🎲 Roll Dadu</button>
        
        <div id="action-group" style="display:none; margin-top: 15px;">
            <button class="btn btn-main" onclick="buyCard()">✅ Beli Sekarang</button>
            <button class="btn" style="background:#888;" onclick="toMarket()">✖ Lewati</button>
        </div>
    </div>
</div>

<script>
    let modal = 0;
    let bulan = 1;
    let currentLevel = 1;
    let assets = new Set();
    let market = new Map();
    let currentCard = null;

    const levels = {
        1: { name: "Startup", multiplier: 1 },
        2: { name: "Small Industry", multiplier: 1.2 },
        3: { name: "Medium Enterprise", multiplier: 1.5 },
        4: { name: "Corporate Giant", multiplier: 2 },
        5: { name: "Industrial Empire", multiplier: 3 }
    };

    const komponen = {
        1: { name: "Lahan & Infrastruktur", base: 150, icon: "🏗️" },
        2: { name: "Mesin & Peralatan", base: 100, icon: "⚙️" },
        3: { name: "Bahan Baku", base: 50, icon: "📦" },
        4: { name: "Tenaga Kerja", base: 40, icon: "👷" },
        5: { name: "Energi & Utility", base: 60, icon: "⚡" },
        6: { name: "Upgrade Factory", base: 120, icon: "🔝" }
    };

    function initModal() {
        let r1 = Math.floor(Math.random() * 6) + 1;
        let r2 = Math.floor(Math.random() * 6) + 1;
        let r3 = Math.floor(Math.random() * 6) + 1;
        modal = (r1 * 100) + (r2 * 10) + r3;
        
        updateUI();
        document.getElementById('btn-init').disabled = true;
        document.getElementById('btn-draw').disabled = false;
    }

    function drawCard() {
        if (bulan > 12) return;

        let die = Math.floor(Math.random() * 6) + 1;
        let item = komponen[die];
        // Harga dipengaruhi level
        let price = Math.floor(item.base * levels[currentLevel].multiplier);
        let isMarket = market.has(die);
        
        if (isMarket) price = Math.floor(price * 1.5);

        currentCard = { id: die, ...item, price, isMarket };

        document.getElementById('draw-area').innerHTML = `
            <div class="card active-icon" style="background: rgba(255,255,255,0.2); border-left: 4px solid var(--gold);">
                <span class="icon">${item.icon}</span>
                <strong>${item.name}</strong><br>
                Biaya: <span style="color:var(--gold)">${price} Milyar</span>
                ${isMarket ? '<br><small style="color:var(--accent)">Harga Market (Denda 150%)</small>' : ''}
            </div>
        `;
        
        document.getElementById('btn-draw').disabled = true;
        document.getElementById('action-group').style.display = 'block';
    }

    function buyCard() {
        if (modal >= currentCard.price) {
            modal -= currentCard.price;
            assets.add(currentCard.id);
            if (currentCard.isMarket) market.delete(currentCard.id);
            nextTurn();
        } else {
            alert("MODAL TIDAK CUKUP! Komponen ini harus dilewati.");
        }
    }

    function toMarket() {
        market.set(currentCard.id, true);
        nextTurn();
    }

    function nextTurn() {
        if (bulan >= 12) {
            showResult();
        } else {
            bulan++;
            document.getElementById('action-group').style.display = 'none';
            document.getElementById('draw-area').innerHTML = '<p>Mencari komponen berikutnya...</p>';
            setTimeout(() => {
                document.getElementById('btn-draw').disabled = false;
                updateUI();
            }, 500);
        }
    }

    function updateUI() {
        document.getElementById('display-modal').innerText = modal;
        document.getElementById('display-bulan').innerText = bulan;
        document.getElementById('level-text').innerText = `Level ${currentLevel}: ${levels[currentLevel].name}`;

        let html = "";
        for (let i = 1; i <= 6; i++) {
            let owned = assets.has(i);
            html += `
                <div class="card ${owned ? 'owned' : 'pending'}">
                    <span class="icon ${owned ? 'active-icon' : ''}">${komponen[i].icon}</span>
                    ${komponen[i].name} ${owned ? '✅' : '(Belum Dibangun)'}
                </div>
            `;
        }
        document.getElementById('asset-list').innerHTML = html;
    }

    function showResult() {
        const overlay = document.getElementById('finish-overlay');
        const title = document.getElementById('finish-title');
        const sub = document.getElementById('finish-sub');
        const icon = document.getElementById('finish-icon');
        
        overlay.style.display = 'flex';

        if (assets.size === 6) {
            title.innerText = "SELAMAT!";
            title.style.color = "var(--success)";
            sub.innerText = `Pabrik Berhasil Dibangun di Level ${currentLevel}!\nSisa Modal: ${modal} Milyar.`;
            icon.innerText = "🏭✨";
            if (currentLevel < 5) currentLevel++;
        } else {
            title.innerText = "MANGKRAK!";
            title.style.color = "var(--accent)";
            sub.innerText = `Waktu habis! Anda hanya menyelesaikan ${assets.size}/6 komponen.\nProyek dihentikan oleh investor.`;
            icon.innerText = "🏚️";
        }
    }

    function resetGame() {
        bulan = 1;
        assets = new Set();
        market = new Map();
        modal = 0;
        document.getElementById('finish-overlay').style.display = 'none';
        document.getElementById('btn-init').disabled = false;
        document.getElementById('btn-draw').disabled = true;
        document.getElementById('action-group').style.display = 'none';
        document.getElementById('draw-area').innerHTML = "<p>Mulai ulang produksi...</p>";
        updateUI();
    }
</script>

</body>
</html>
