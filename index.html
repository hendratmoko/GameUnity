<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Factory Rush - Digital Edition</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .game-container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #263238; color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; }
        .stat-box { text-align: center; }
        .stat-val { display: block; font-size: 1.5em; font-weight: bold; color: #4fc3f7; }

        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .section { background: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; border-radius: 10px; min-height: 400px; }
        h3 { border-bottom: 2px solid #cfd8dc; padding-bottom: 10px; margin-top: 0; color: #37474f; }

        .card { background: white; border-left: 5px solid #2196f3; padding: 12px; margin: 10px 0; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card.asset-owned { border-left-color: #4caf50; background: #e8f5e9; }
        .card.market-item { border-left-color: #ff9800; }
        
        .price-tag { font-weight: bold; color: #2e7d32; }
        .market-tag { color: #d32f2f; font-size: 0.8em; font-style: italic; }

        .controls { margin-top: 25px; text-align: center; border-top: 2px solid #eee; padding-top: 20px; }
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; font-weight: bold; }
        #btn-modal { background: #673ab7; color: white; }
        #btn-draw { background: #2196f3; color: white; }
        button:disabled { background: #cfd8dc !important; cursor: not-allowed; }
        
        .action-group { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        .btn-buy { background: #4caf50; color: white; }
        .btn-market { background: #ff9800; color: white; }

        #log-message { margin-top: 15px; padding: 10px; border-radius: 5px; background: #fff9c4; color: #827717; min-height: 20px; font-weight: 500; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <div class="stat-box">BULAN<span id="display-bulan" class="stat-val">1</span></div>
        <h2>FACTORY RUSH</h2>
        <div class="stat-box">MODAL (JT)<span id="display-modal" class="stat-val">0</span></div>
    </div>

    <div id="log-message">Silakan Roll Modal untuk memulai simulasi pembangunan pabrik.</div>

    <div class="main-layout">
        <div class="section">
            <h3>🛒 SHOP & MARKET</h3>
            <div id="current-draw-area">
                </div>
            <div id="market-list">
                </div>
        </div>

        <div class="section">
            <h3>🏭 ASET PABRIK</h3>
            <div id="asset-list">
                </div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-modal" onclick="initModal()">1. Roll Modal Awal</button>
        <button id="btn-draw" onclick="drawCard()" disabled>2. Ambil Kartu (Dadu)</button>
        
        <div id="action-buttons" class="action-group" style="display:none;">
            <button class="btn-buy" onclick="buyCard()">Beli & Jadikan Aset</button>
            <button class="btn-market" onclick="toMarket()">Taruh di Market</button>
        </div>
    </div>
</div>

<script>
    let modal = 0;
    let bulan = 1;
    let assetsOwned = new Set();
    let marketCards = new Map(); // Untuk menyimpan kartu di market dan status harganya
    let currentCard = null;

    // Daftar Komponen Sesuai Permintaan
    const komponen = {
        1: { nama: "Lahan & Infrastruktur", harga: 150 },
        2: { nama: "Mesin & Peralatan", harga: 100 },
        3: { nama: "Bahan Baku", harga: 50 },
        4: { nama: "Tenaga Kerja", harga: 40 },
        5: { nama: "Energi & Utility", harga: 60 },
        6: { nama: "Upgrade Factory", harga: 120 }
    };

    function initModal() {
        let r1 = Math.floor(Math.random() * 6) + 1;
        let r2 = Math.floor(Math.random() * 6) + 1;
        let r3 = Math.floor(Math.random() * 6) + 1;
        modal = (r1 * 100) + (r2 * 10) + r3;
        
        updateDisplay();
        document.getElementById('btn-modal').disabled = true;
        document.getElementById('btn-draw').disabled = false;
        log("Modal masuk: Rp " + modal + " JT. Silakan ambil kartu komponen pertama.");
    }

    function drawCard() {
        if (bulan > 12) return;

        let die = Math.floor(Math.random() * 6) + 1;
        let info = komponen[die];
        let finalPrice = info.harga;
        let isFromMarket = false;

        if (marketCards.has(die)) {
            finalPrice = Math.floor(info.harga * 1.5);
            isFromMarket = true;
        }

        currentCard = { id: die, nama: info.nama, harga: finalPrice, market: isFromMarket };

        document.getElementById('current-draw-area').innerHTML = `
            <div class="card ${isFromMarket ? 'market-item' : ''}">
                <strong>[${die}] ${currentCard.nama}</strong><br>
                Harga: <span class="price-tag">${currentCard.harga} JT</span>
                ${isFromMarket ? '<br><span class="market-tag">(Pernah ditolak: Harga +50%)</span>' : ''}
            </div>
        `;
        
        document.getElementById('btn-draw').disabled = true;
        document.getElementById('action-buttons').style.display = 'flex';
    }

    function buyCard() {
        if (modal >= currentCard.harga) {
            modal -= currentCard.harga;
            assetsOwned.add(currentCard.id);
            if (currentCard.market) marketCards.delete(currentCard.id);
            
            log("Berhasil membeli " + currentCard.nama);
            nextTurn();
        } else {
            alert("Modal tidak mencukupi untuk membeli aset ini!");
        }
    }

    function toMarket() {
        marketCards.set(currentCard.id, true);
        log(currentCard.nama + " dipindahkan ke Market Place.");
        nextTurn();
    }

    function nextTurn() {
        document.getElementById('action-buttons').style.display = 'none';
        document.getElementById('current-draw-area').innerHTML = "";
        
        if (bulan >= 12) {
            checkGameOver();
        } else {
            bulan++;
            updateDisplay();
            document.getElementById('btn-draw').disabled = false;
        }
    }

    function updateDisplay() {
        document.getElementById('display-modal').innerText = modal;
        document.getElementById('display-bulan').innerText = bulan;
        
        // Update List Aset (Kolom Kanan)
        let assetHTML = "";
        for (let i = 1; i <= 6; i++) {
            if (assetsOwned.has(i)) {
                assetHTML += `<div class="card asset-owned">✅ ${komponen[i].nama}</div>`;
            } else {
                assetHTML += `<div class="card" style="opacity: 0.5; border-left-color: #ccc;">❌ ${komponen[i].nama} (Belum Ada)</div>`;
            }
        }
        document.getElementById('asset-list').innerHTML = assetHTML;

        // Update Market (Kolom Kiri Bawah)
        let marketHTML = marketCards.size > 0 ? "<h4>Market Place (Terbuka):</h4>" : "";
        marketCards.forEach((val, key) => {
            marketHTML += `<div class="card market-item" style="font-size:0.85em;">${komponen[key].nama} (Denda 150%)</div>`;
        });
        document.getElementById('market-list').innerHTML = marketHTML;
    }

    function log(msg) {
        document.getElementById('log-message').innerText = msg;
    }

    function checkGameOver() {
        updateDisplay();
        document.getElementById('btn-draw').disabled = true;
        
        let uniqueAssets = assetsOwned.size;
        let resultTitle = "";
        let resultContent = "";

        if (uniqueAssets === 6) {
            if (modal > 0) {
                resultTitle = "🏆 MENANG (LABA)";
                resultContent = "Selamat! Pabrik lengkap dalam 12 bulan dan sisa modal tersedia untuk operasional.";
            } else {
                resultTitle = "🏅 MENANG (PAS)";
                resultContent = "Pabrik berhasil dibangun, namun modal habis total. Pabrik berdiri tapi tidak bisa beroperasi.";
            }
        } else {
            resultTitle = "❌ KALAH (MANGKRAK)";
            resultContent = `Pembangunan gagal. Anda hanya mengumpulkan ${uniqueAssets}/6 komponen dalam 12 bulan.`;
        }

        document.getElementById('main-layout').innerHTML = `
            <div style="grid-column: span 2; text-align: center; padding: 40px; background: #fff; border: 4px solid #37474f; border-radius: 15px;">
                <h1 style="font-size: 3em; margin: 0;">${resultTitle}</h1>
                <p style="font-size: 1.2em; color: #555;">${resultContent}</p>
                <button onclick="location.reload()" style="background:#37474f; margin-top:20px;">Main Lagi</button>
            </div>
        `;
    }
</script>

</body>
</html>
